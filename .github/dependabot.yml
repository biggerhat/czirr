# Weekly dependency updates, grouped so each ecosystem is one pull request, not a dozen. Security fixes still arrive on their own.
# `cooldown` waits a few days after a release before proposing it, which filters out most compromised or yanked releases.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
